apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbit-broker
  namespace: message-broker
spec:
  selector:
    matchLabels:
      app: rabbit-broker
  template:
    metadata:
      labels:
        app: rabbit-broker
    spec:
      containers:
        - name: rabbit-broker
          image: rabbitmq:4.3.0-management-alpine
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 500m
          volumeMounts:
            - name:  rabbit-configmap
              mountPath:  /etc/rabbitmq/definitions.json
              subPath: definitions.json

            - name: rabbit-configmap
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          
          livenessProbe:
            exec:
              command:
               - rabbitmq-diagnostics
               - ping
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - check_port_connectivity
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          ports:
            - containerPort: 5672
            - containerPort: 15672
      volumes:
        - name: rabbit-configmap
          configMap:
            name: rabbit-configmap

        - name:  rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc

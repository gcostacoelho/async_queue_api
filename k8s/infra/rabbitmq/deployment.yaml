apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbit-broker
  namespace: message-broker
spec:
  selector:
    matchLabels:
      app: rabbit-broker
  template:
    metadata:
      labels:
        app: rabbit-broker
    spec:
      containers:
        - name: rabbit-broker
          image: rabbitmq:4.3.0-management-alpine
          # resources:
          #   limits:
          #     memory: "512Mi"
          #     cpu: "500m"
          #   requests:
          #     memory: 1Gi
          #     cpu: 200m 
          volumeMounts:
            - name:  rabbit-configmap
              mountPath:  /etc/rabbitmq/definitions.json
              subPath: definitions.json

            - name: rabbit-configmap
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf

          ports:
            - containerPort: 5672
            - containerPort: 15672
      volumes:
        - name: rabbit-configmap
          configMap:
            name: rabbit-configmap

        - name:  rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc

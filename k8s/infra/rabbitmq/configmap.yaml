apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbit-configmap
  namespace: message-broker
data:
  definitions.json: |
    {
      "users": [
        {
          "name": "user",
          "password": "pass",
          "tags": "administrator"
        }
      ],
      "vhosts": [
        {
          "name": "/"
        }
      ],
      "permissions": [
        {
          "user": "user",
          "vhost": "/",
          "configure": ".*",
          "write": ".*",
          "read": ".*"
        }
      ],
      "queues": [
        {
          "name": "tasks",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        }
      ]
    }

  rabbitmq.conf: |
    management.load_definitions = /etc/rabbitmq/definitions.json
    loopback_users.guest = false

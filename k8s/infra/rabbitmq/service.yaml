apiVersion: v1
kind: Service
metadata:
  name: rabbit-service-manager
  namespace: message-broker
spec:
  type: NodePort
  selector:
    app: rabbit-broker
  ports:
    - port: 15672 # Only this port is necessary expose for the internet
      targetPort: 15672

---

apiVersion: v1
kind: Service
metadata:
  name: rabbit-service
  namespace: message-broker
spec:
  type: ClusterIP
  selector:
    app: rabbit-broker
  ports:
  - port: 5672
    targetPort: 5672

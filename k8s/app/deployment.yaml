apiVersion: apps/v1
kind: Deployment
metadata:
  name: async-queue-api
  namespace: async-queue
spec:
  selector:
    matchLabels:
      app: async-queue-api
  replicas: 1
  template:
    metadata:
      labels:
        app: async-queue-api
    spec:
      containers:
      - name: async-queue-api
        image: gcostacoelho/async-queue-api
        resources:
          limits:
            memory: 128Mi
            cpu: 500m
          requests:
            memory: 128Mi
            cpu: 200m
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 20
          failureThreshold: 5
          periodSeconds: 5
        ports:
        - containerPort: 3000
        envFrom:
          - configMapRef:
              name: async-queue-api-configmap
          - secretRef:
              name: app-secrets